version: 1.0.0
schema:
  fields:
  - name: agent_id
    type: string
    nullable: false
  - name: tool_name
    type: string
    nullable: false
  - name: cost_usd
    type: float
    nullable: false
  - name: timestamp
    type: string
    nullable: false
allowed_tools:
- search_tool
- python_repl
- database_writer
- rag_retriever
- file_search
thresholds:
  max_cost_per_call: 50.0
  max_payload_bytes: 32768
  freshness_window_hours: 24
  future_tolerance_minutes: 5
